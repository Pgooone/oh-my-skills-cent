[package]
name = "oh-my-skills"
version = "0.1.3"
description = "Desktop workbench for local Agent Skills"
authors = ["Oh My Skills"]
edition = "2021"
rust-version = "1.77.2"
repository = "https://github.com/nextcaicai/oh-my-skills"
homepage = "https://github.com/nextcaicai/oh-my-skills"
license = "MIT"

[lib]
name = "oh_my_skills_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["tauri-shell"]
tauri-shell = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]
web = ["dep:axum", "dep:tower-http", "dep:rust-embed", "dep:tokio"]

[dependencies]
axum = { version = "0.8", optional = true }
chrono = { version = "0.4", features = ["serde"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "oh-my-skills"
path = "src/main.rs"
required-features = ["tauri-shell"]

[[bin]]
name = "oms-web"
path = "src/bin/oms-web.rs"
required-features = ["web"]
